<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KL STORE - Painel Administrativo Completo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: '#D4AF37',
                        goldDark: '#AA8C2C',
                        darkBg: '#121212',
                        cardBg: '#1E1E1E'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkBg text-gray-100 min-h-screen font-sans">

    <!-- Cabeçalho -->
    <header class="border-b border-gold/30 bg-cardBg py-4 px-8 flex justify-between items-center shadow-lg">
        <div class="flex items-center space-x-3">
            <span class="text-3xl">👑</span>
            <h1 class="text-2xl font-bold tracking-wider text-gold">KL STORE - Gestão Total</h1>
        </div>
        <div id="status-auth" class="text-sm text-gray-400">
            Estado: <span id="auth-label" class="text-red-400 font-semibold">Desconectado</span>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-6 grid grid-cols-1 md:grid-cols-2 gap-6 mt-6">

        <!-- CAIXA DE LOGIN -->
        <section class="bg-cardBg border border-gold/20 rounded-xl p-6 shadow-xl">
            <h2 class="text-xl font-semibold text-gold mb-4 border-b border-gold/20 pb-2">1. Acesso do Gerente</h2>
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm text-gray-300 mb-1">Utilizador</label>
                    <input type="text" id="username" value="admin" class="w-full bg-black/50 border border-gold/30 rounded px-3 py-2 text-white focus:outline-none focus:border-gold" required>
                </div>
                <div>
                    <label class="block text-sm text-gray-300 mb-1">Senha</label>
                    <input type="password" id="password" value="123" class="w-full bg-black/50 border border-gold/30 rounded px-3 py-2 text-white focus:outline-none focus:border-gold" required>
                </div>
                <button type="submit" class="w-full bg-gold hover:bg-goldDark text-black font-bold py-2 px-4 rounded transition duration-200">
                    Entrar no Sistema
                </button>
            </form>
            <div id="login-msg" class="mt-3 text-sm text-center"></div>
        </section>

        <!-- CAIXA DE CADASTRAR CATEGORIA -->
        <section class="bg-cardBg border border-gold/20 rounded-xl p-6 shadow-xl">
            <h2 class="text-xl font-semibold text-gold mb-4 border-b border-gold/20 pb-2">2. Nova Categoria</h2>
            <form id="categoria-form" class="space-y-4">
                <div>
                    <label class="block text-sm text-gray-300 mb-1">Nome da Categoria</label>
                    <input type="text" id="cat-nome" placeholder="Ex: Eletrônicos" class="w-full bg-black/50 border border-gold/30 rounded px-3 py-2 text-white focus:outline-none focus:border-gold" required>
                </div>
                <button type="submit" class="w-full bg-gold hover:bg-goldDark text-black font-bold py-2 px-4 rounded transition duration-200">
                    Criar Categoria
                </button>
            </form>
            <div id="cat-msg" class="mt-3 text-sm text-center"></div>
        </section>

        <!-- CAIXA DE CADASTRAR PRODUTO -->
        <section class="bg-cardBg border border-gold/20 rounded-xl p-6 shadow-xl md:col-span-2">
            <h2 class="text-xl font-semibold text-gold mb-4 border-b border-gold/20 pb-2">3. Cadastrar Mercadoria com Foto</h2>
            <form id="produto-form" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-6 gap-4">
                <input type="text" id="prod-nome" placeholder="Nome do Produto" class="bg-black/50 border border-gold/30 rounded px-3 py-2 text-white focus:outline-none focus:border-gold" required>
                <input type="text" id="prod-desc" placeholder="Descrição" class="bg-black/50 border border-gold/30 rounded px-3 py-2 text-white focus:outline-none focus:border-gold">
                <input type="number" step="0.01" id="prod-preco" placeholder="Preço (R$)" class="bg-black/50 border border-gold/30 rounded px-3 py-2 text-white focus:outline-none focus:border-gold" required>
                <input type="number" id="prod-qtd" placeholder="Quantidade" class="bg-black/50 border border-gold/30 rounded px-3 py-2 text-white focus:outline-none focus:border-gold" required>
                <input type="number" id="prod-cat" placeholder="ID da Categoria" class="bg-black/50 border border-gold/30 rounded px-3 py-2 text-white focus:outline-none focus:border-gold" required>
                <input type="text" id="prod-foto" placeholder="Link da Foto (URL)" class="bg-black/50 border border-gold/30 rounded px-3 py-2 text-white focus:outline-none focus:border-gold">
                <button type="submit" class="sm:col-span-2 lg:col-span-6 bg-gold hover:bg-goldDark text-black font-bold py-2 rounded transition duration-200">
                    Adicionar ao Estoque
                </button>
            </form>
            <div id="prod-msg" class="mt-3 text-sm text-center"></div>
        </section>

        <!-- PRATELEIRA / LISTAGEM DE PRODUTOS -->
        <section class="bg-cardBg border border-gold/20 rounded-xl p-6 shadow-xl md:col-span-2">
            <div class="flex justify-between items-center mb-4 border-b border-gold/20 pb-2">
                <h2 class="text-xl font-semibold text-gold">4. Prateleiras Virtuais (Estoque Atual)</h2>
                <button onclick="carregarProdutos()" class="bg-gold/20 border border-gold text-gold hover:bg-gold hover:text-black px-3 py-1 rounded text-sm transition">
                    Atualizar Lista
                </button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-gold/20 text-gold text-sm">
                            <th class="p-3">Foto</th>
                            <th class="p-3">ID</th>
                            <th class="p-3">Nome</th>
                            <th class="p-3">Descrição</th>
                            <th class="p-3">Preço</th>
                            <th class="p-3">Qtd</th>
                            <th class="p-3">Cat ID</th>
                            <th class="p-3 text-center">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-produtos" class="text-sm divide-y divide-gray-800">
                        <!-- Os produtos entram aqui via JavaScript -->
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <!-- Script de Integração com a API -->
    <script>
        const API_URL = "http://127.0.0.1:8000";
        let tokenAcesso = "";

        // 1. LOGIN
        document.getElementById("login-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const user = document.getElementById("username").value;
            const pass = document.getElementById("password").value;

            const formData = new URLSearchParams();
            formData.append("username", user);
            formData.append("password", pass);

            try {
                const response = await fetch(`${API_URL}/token`, {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: formData
                });
                const data = await response.json();
                if (response.ok) {
                    tokenAcesso = data.access_token;
                    const lbl = document.getElementById("auth-label");
                    lbl.innerText = "Conectado";
                    lbl.className = "text-green-400 font-semibold";
                    document.getElementById("login-msg").innerText = "Login efetuado com sucesso!";
                    document.getElementById("login-msg").className = "mt-3 text-sm text-center text-green-400";
                    carregarProdutos();
                } else {
                    document.getElementById("login-msg").innerText = "Erro ao autenticar!";
                    document.getElementById("login-msg").className = "mt-3 text-sm text-center text-red-400";
                }
            } catch (err) {
                console.error(err);
                alert("Erro de conexão com a API.");
            }
        });

        // 2. CRIAR CATEGORIA
        document.getElementById("categoria-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            if (!tokenAcesso) { alert("Faça o login primeiro!"); return; }
            const nome = document.getElementById("cat-nome").value;

            const response = await fetch(`${API_URL}/categorias/`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${tokenAcesso}`
                },
                body: JSON.stringify({ nome })
            });

            const msgDiv = document.getElementById("cat-msg");
            if (response.ok) {
                msgDiv.innerText = "Categoria criada com sucesso!";
                msgDiv.className = "mt-3 text-sm text-center text-green-400";
                document.getElementById("cat-nome").value = "";
            } else {
                msgDiv.innerText = "Erro ao criar categoria.";
                msgDiv.className = "mt-3 text-sm text-center text-red-400";
            }
        });

        // 3. CADASTRAR PRODUTO
        document.getElementById("produto-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            if (!tokenAcesso) { alert("Faça o login primeiro!"); return; }

            const produto = {
                nome: document.getElementById("prod-nome").value,
                descricao: document.getElementById("prod-desc").value,
                preco: parseFloat(document.getElementById("prod-preco").value),
                quantidade: parseInt(document.getElementById("prod-qtd").value),
                categoria_id: parseInt(document.getElementById("prod-cat").value),
                foto_url: document.getElementById("prod-foto").value || "https://via.placeholder.com/50"
            };

            const response = await fetch(`${API_URL}/produtos/`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${tokenAcesso}`
                },
                body: JSON.stringify(produto)
            });

            const msgDiv = document.getElementById("prod-msg");
            if (response.ok) {
                msgDiv.innerText = "Produto cadastrado com sucesso!";
                msgDiv.className = "mt-3 text-sm text-center text-green-400";
                document.getElementById("produto-form").reset();
                carregarProdutos();
            } else {
                const errData = await response.json();
                msgDiv.innerText = "Erro: " + (errData.detail || "Verifique os dados");
                msgDiv.className = "mt-3 text-sm text-center text-red-400";
            }
        });

        // 4. LISTAR PRODUTOS NA TABELA
        async function carregarProdutos() {
            if (!tokenAcesso) return;

            try {
                const response = await fetch(`${API_URL}/produtos/`, {
                    headers: { "Authorization": `Bearer ${tokenAcesso}` }
                });
                if (response.ok) {
                    const produtos = await response.json();
                    const tbody = document.getElementById("tabela-produtos");
                    tbody.innerHTML = "";

                    produtos.forEach(p => {
                        const imgUrl = p.foto_url || "https://via.placeholder.com/50";
                        tbody.innerHTML += `
                            <tr class="hover:bg-black/20">
                                <td class="p-3"><img src="${imgUrl}" alt="Produto" class="w-10 h-10 object-cover rounded border border-gold/30"></td>
                                <td class="p-3 text-gold">${p.id}</td>
                                <td class="p-3 font-medium">${p.nome}</td>
                                <td class="p-3 text-gray-400">${p.descricao || '-'}</td>
                                <td class="p-3 text-green-400">R$ ${p.preco.toFixed(2)}</td>
                                <td class="p-3">${p.quantidade}</td>
                                <td class="p-3 text-center">${p.categoria_id}</td>
                                <td class="p-3 text-center">
                                    <button onclick="deletarProduto(${p.id})" class="bg-red-500/20 text-red-400 border border-red-500/50 hover:bg-red-500 hover:text-white px-2 py-1 rounded text-xs transition">
                                        Excluir
                                    </button>
                                </td>
                            </tr>
                        `;
                    });
                }
            } catch (err) {
                console.error("Erro ao carregar produtos", err);
            }
        }

        // 5. DELETAR PRODUTO
        async function deletarProduto(id) {
            if (!confirm("Tem certeza que deseja apagar este produto do estoque?")) return;

            const response = await fetch(`${API_URL}/produtos/${id}`, {
                method: "DELETE",
                headers: { "Authorization": `Bearer ${tokenAcesso}` }
            });

            if (response.ok) {
                carregarProdutos();
            } else {
                alert("Erro ao excluir o produto.");
            }
        }
    </script>
</body>
</html>
